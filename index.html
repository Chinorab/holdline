<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="One wildfire a day, on your real table. A seated mixed reality game for Meta Quest." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#e4e2dd" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preload" href="./fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Holdline</title>
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
        src: url('./fonts/archivo-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('./fonts/atkinson-hyperlegible-next-latin.woff2') format('woff2');
      }
      :root {
        --board: #e4e2dd;
        --card: #f3f1ed;
        --ink: #1d1c1a;
        --ink-hover: #3a3835;
        --graphite: #5d5a56;
        --rule: #cac7c2;
        --fire: #f6590c;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--board);
        color: var(--ink);
        font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
      }
      #scene-container {
        position: fixed;
        inset: 0;
      }
      #landing {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        box-sizing: border-box;
        background: var(--board);
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        overflow: hidden;
      }
      #landing[hidden] {
        display: none;
      }
      .hero {
        flex: 999 1 560px;
        min-width: 0;
        margin: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
      }
      .hero img {
        display: block;
        width: 118%;
        max-width: none;
        height: auto;
        margin-left: -18%;
      }
      .copy {
        flex: 1 1 440px;
        min-width: 0;
        max-width: 600px;
        box-sizing: border-box;
        padding: clamp(36px, 6vw, 80px) clamp(16px, 5vw, 64px) clamp(36px, 6vw, 80px) clamp(16px, 2vw, 24px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
      }
      .wordmark {
        margin: 0;
        font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        font-stretch: 112%;
        font-weight: 800;
        font-size: clamp(48px, 6.2vw, 80px);
        line-height: 0.9;
        letter-spacing: -0.04em;
      }
      .tagline {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 31px);
        line-height: 1.22;
        font-weight: 500;
        max-width: 15em;
        text-wrap: balance;
      }
      .act {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
        margin-top: 6px;
      }
      .enter {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        min-height: 76px;
        padding: 0 30px 0 34px;
        border: 0;
        border-radius: 6px;
        background: var(--ink);
        color: var(--card);
        font: inherit;
        font-size: 25px;
        font-weight: 650;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      .enter:hover {
        background: var(--ink-hover);
      }
      .enter:active {
        transform: translateY(1px);
      }
      .enter:disabled {
        background: var(--graphite);
        cursor: default;
      }
      .enter:focus-visible,
      .link:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }
      .enter[hidden] {
        display: none;
      }
      .note {
        margin: 0;
        font-size: 21px;
        line-height: 1.35;
        font-weight: 600;
        max-width: 22em;
      }
      .facts {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        font-size: 20px;
        line-height: 1.3;
        color: var(--graphite);
      }
      .facts li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .link {
        align-self: flex-start;
        margin-top: 10px;
        font-size: 19px;
        color: var(--ink);
        text-underline-offset: 5px;
        text-decoration-thickness: 1.5px;
      }
      .link:hover {
        color: var(--graphite);
      }
      @media (max-width: 640px) {
        .hero {
          flex-basis: 100%;
          max-height: 300px;
          overflow: hidden;
          align-items: center;
          justify-content: center;
        }
        .hero img {
          width: 640px;
          margin: -66px 0 0 0;
        }
        #landing {
          align-content: flex-start;
        }
        .copy {
          justify-content: flex-start;
          padding: 26px 16px 28px;
          gap: 18px;
        }
        .enter {
          width: 100%;
          justify-content: space-between;
          min-height: 64px;
          font-size: 21px;
          padding: 0 22px 0 24px;
        }
        .facts {
          font-size: 17px;
          gap: 8px 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .enter {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <main id="landing">
      <figure class="hero">
        <img
          src="./hero.webp"
          width="1800"
          height="1125"
          alt="The Holdline board: a paper relief valley with a river, a road and six houses. A fire burns in the forest and a dug crew line runs across its path."
        />
      </figure>
      <section class="copy">
        <h1 class="wordmark" translate="no" data-copy="name">Holdline</h1>
        <p class="tagline" data-copy="tagline">One wildfire a day, on your real table.</p>
        <div class="act">
          <button class="enter" type="button" disabled>
            <span data-copy="enter">Loading</span>
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3.5 12h16M13.5 6l6 6-6 6"></path></svg>
          </button>
          <p class="note" hidden></p>
          <ul class="facts">
            <li><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M7.5 12.5V6.2a1.5 1.5 0 0 1 3 0v4.8M10.5 10.5V4.3a1.5 1.5 0 0 1 3 0v6.2M13.5 10.5V5.6a1.5 1.5 0 0 1 3 0V12"></path><path d="M16.5 11.5V9a1.5 1.5 0 0 1 3 0v5.5c0 4-2.6 7-6.6 7-3 0-4.6-1.5-6-4L4.3 13.2a1.5 1.5 0 0 1 2.6-1.5l.6 1"></path></svg><span data-copy="fact-0">Hands only.</span></li>
            <li><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M7 2.5v18.5M7 13h10v8"></path><path d="M7 13l-1-3"></path></svg><span data-copy="fact-1">Seated.</span></li>
            <li><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 21.5a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15z"></path><path d="M9.5 2.5h5M12 2.5v4M12 14V10.5M18 6.5l1.5-1.5"></path></svg><span data-copy="fact-2">5 minutes.</span></li>
          </ul>
        </div>
        <a class="link" href="./privacy.html" data-copy="privacy">Privacy</a>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
